services:
  - type: web
    name: weld-lavadero
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py --host 0.0.0.0
    envVars:
      - key: APP_USER
        value: admin
      - key: APP_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: weld-lavadero-db
          property: connectionString

databases:
  - name: weld-lavadero-db
    plan: free
