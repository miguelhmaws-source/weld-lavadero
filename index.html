<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WELD Lavadero</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">W</div>
          <div>
            <strong>WELD</strong>
            <span>Lavadero</span>
          </div>
        </div>

        <nav class="nav" aria-label="Navegacion principal">
          <button class="nav-item active" data-view="dashboard">Panel</button>
          <button class="nav-item" data-view="queue">Cola</button>
          <button class="nav-item" data-view="cash">Caja</button>
          <button class="nav-item" data-view="clients">Clientes</button>
          <button class="nav-item" data-view="employees">Empleados</button>
          <button class="nav-item" data-view="inventory">Inventario</button>
          <button class="nav-item" data-view="reports">Reportes</button>
          <button class="nav-item" data-view="settings">Servicios</button>
        </nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p class="section-label">Operacion diaria</p>
            <h1 id="view-title">Panel de control</h1>
          </div>
          <div class="topbar-meta">
            <span id="today-label"></span>
            <span class="user-chip">JP</span>
            <span>Administrador</span>
          </div>
          <div class="topbar-actions">
            <button class="ghost-button" id="logout-button">Cerrar sesion</button>
            <button class="ghost-button" id="open-business">Abrir negocio</button>
            <button class="danger-button" id="close-business">Cerrar negocio</button>
            <button class="ghost-button" id="export-xlsx">Exportar XLSX</button>
            <button class="primary-button" data-open-modal="vehicle-modal">Nuevo vehiculo</button>
          </div>
        </header>

        <section id="dashboard" class="view active"></section>
        <section id="queue" class="view"></section>
        <section id="cash" class="view"></section>
        <section id="clients" class="view"></section>
        <section id="employees" class="view"></section>
        <section id="inventory" class="view"></section>
        <section id="reports" class="view"></section>
        <section id="settings" class="view"></section>
      </main>
    </div>

    <dialog id="vehicle-modal" class="modal">
      <form id="vehicle-form" method="dialog" class="modal-card">
        <div class="modal-head">
          <div>
            <p class="section-label">Ingreso a cola</p>
            <h2>Registrar vehiculo</h2>
          </div>
          <button type="button" class="icon-button" data-close-modal="vehicle-modal">x</button>
        </div>

        <div class="form-grid">
          <label>Placa<input name="plate" required placeholder="ABC-123" /></label>
          <label>Cliente<input name="client" required placeholder="Nombre del cliente" /></label>
          <label>Telefono<input name="phone" placeholder="999 999 999" /></label>
          <label>Vehiculo<input name="vehicle" placeholder="Toyota Corolla" /></label>
          <label>Color<input name="color" placeholder="Blanco" /></label>
          <label>Servicio<select name="service" id="service-select"></select></label>
          <label>Empleado<select name="employee" id="employee-select"></select></label>
          <label>Pago<select name="payment">
            <option>Efectivo</option>
            <option>Tarjeta</option>
            <option>Transferencia</option>
            <option>Yape / Plin</option>
          </select></label>
          <label class="full">Observaciones<textarea name="notes" rows="3" placeholder="Rayones, objetos internos, indicaciones especiales"></textarea></label>
        </div>

        <div class="modal-actions">
          <button type="button" class="ghost-button" data-close-modal="vehicle-modal">Cancelar</button>
          <button class="primary-button" type="submit">Guardar turno</button>
        </div>
      </form>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
